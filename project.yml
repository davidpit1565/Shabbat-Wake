name: ShabbatWake
options:
  bundleIdPrefix: com.shabbatwake
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Shabbat Wake"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  ShabbatWake:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/**"
          - "Widgets/**"
          - "AlarmSoundGenerator.py"
    resources:
      - path: App/Resources
    preBuildScripts:
      - name: Generate alarm sounds
        script: python3 "$SRCROOT/App/AlarmSoundGenerator.py"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shabbatwake.ios
        PRODUCT_NAME: "Shabbat Wake"
        PRODUCT_MODULE_NAME: ShabbatWake
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Shabbat Wake requires your current location to calculate local Shabbat times. No times are calculated if you deny access."
        INFOPLIST_KEY_NSAlarmKitUsageDescription: "Shabbat Wake schedules the wake-up alarms you create using Apple system alarm features."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ShabbatWakeWidget
        embed: true
    scheme:
      testTargets:
        - ShabbatWakeTests
  ShabbatWakeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Widgets
      - path: App/ShabbatWakeLiveActivityAttributes.swift
    info:
      path: App/Widgets/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shabbatwake.ios.widget
        PRODUCT_NAME: "Shabbat Wake Widget"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Shabbat Wake"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  ShabbatWakeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ShabbatWake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shabbatwake.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Shabbat Wake.app/Shabbat Wake"
        BUNDLE_LOADER: "$(TEST_HOST)"
