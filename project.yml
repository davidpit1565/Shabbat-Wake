name: ShabbatWake
options:
  bundleIdPrefix: com.shabbatwake
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Shabbat Waker"
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ShabbatWake:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/**"
          - "Widgets/**"
          - "AlarmSoundGenerator.py"
      # Generated by App/AlarmSoundGenerator.py (Scripts/bootstrap.sh runs it before xcodegen).
      - path: App/Resources
        buildPhase: resources
    preBuildScripts:
      - name: Generate alarm sounds
        script: python3 "$SRCROOT/App/AlarmSoundGenerator.py"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shabbatwake.ios
        PRODUCT_NAME: "Shabbat Wake"
        PRODUCT_MODULE_NAME: ShabbatWake
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Shabbat Waker uses your location to calculate local Shabbat times. Without access, no times are shown."
        INFOPLIST_KEY_NSAlarmKitUsageDescription: "Shabbat Waker schedules the wake-up alarms you create using Apple system alarm features."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconClassic AppIconMinimal AppIconSunrise AppIconTimeLight AppIconGlass AppIconPremiumTech"
        CODE_SIGN_ENTITLEMENTS: Config/ShabbatWake.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    dependencies:
      - target: ShabbatWakeWidget
        embed: true
      - target: ShabbatWakeWatch
        embed: true
    scheme:
      testTargets:
        - ShabbatWakeTests
      storeKitConfiguration: Config/Pro.storekit
  ShabbatWakeWidget:
    type: app-extension
    platform: iOS
    info:
      path: Config/WidgetInfo.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: App/Widgets
      - path: App/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shabbatwake.ios.widget
        PRODUCT_NAME: "Shabbat Wake Widget"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/ShabbatWakeWidget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Shabbat Waker"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  ShabbatWakeWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/App
      - path: App/Shared
        excludes:
          - "ShabbatWakeAlarmMetadata.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shabbatwake.ios.watchkitapp
        PRODUCT_NAME: "Shabbat Waker"
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Shabbat Waker"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.shabbatwake.ios
        INFOPLIST_KEY_WKApplication: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/ShabbatWakeWatch.entitlements
    dependencies:
      - target: ShabbatWakeWatchWidget
        embed: true

  ShabbatWakeWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    info:
      path: Config/WatchWidgetInfo.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: Watch/Widget
      - path: App/Shared
        excludes:
          - "ShabbatWakeAlarmMetadata.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shabbatwake.ios.watchkitapp.widget
        PRODUCT_NAME: "Shabbat Waker Watch Widget"
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        CODE_SIGN_ENTITLEMENTS: Config/ShabbatWakeWatchWidget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Shabbat Waker"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  ShabbatWakeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ShabbatWake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shabbatwake.ios.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Shabbat Wake.app/Shabbat Wake"
        BUNDLE_LOADER: "$(TEST_HOST)"
