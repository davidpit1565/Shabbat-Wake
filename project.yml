name: ShabbatWake
options:
  bundleIdPrefix: com.shabbatwake
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Shabbat Wake"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ShabbatWake:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/**"
          - "Widgets/**"
          - "AlarmSoundGenerator.py"
    resources:
      - path: App/Resources
    preBuildScripts:
      - name: Generate alarm sounds
        script: python3 "$SRCROOT/App/AlarmSoundGenerator.py"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shabbatwake.ios
        PRODUCT_NAME: "Shabbat Wake"
        PRODUCT_MODULE_NAME: ShabbatWake
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Shabbat Wake uses your location to calculate local Shabbat times. Without access, no times are shown."
        INFOPLIST_KEY_NSAlarmKitUsageDescription: "Shabbat Wake schedules the wake-up alarms you create using Apple system alarm features."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/ShabbatWake.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    dependencies:
      - target: ShabbatWakeWidget
        embed: true
    scheme:
      testTargets:
        - ShabbatWakeTests
  ShabbatWakeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Widgets
      - path: App/Shared
      - path: App/ShabbatWakeLiveActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shabbatwake.ios.widget
        PRODUCT_NAME: "Shabbat Wake Widget"
        CODE_SIGN_ENTITLEMENTS: Config/ShabbatWakeWidget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Shabbat Wake"
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_CFBundlePackageType: XPC!
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  ShabbatWakeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ShabbatWake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shabbatwake.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Shabbat Wake.app/Shabbat Wake"
        BUNDLE_LOADER: "$(TEST_HOST)"
