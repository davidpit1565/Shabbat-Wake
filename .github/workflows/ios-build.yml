name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shabbat-wake-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate original alarm sound assets
        run: python3 App/AlarmSoundGenerator.py

      - name: Validate widget extension plist and generated sounds
        run: |
          plutil -lint App/Widgets/Info.plist
          plutil -lint App/PrivacyInfo.xcprivacy App/Widgets/PrivacyInfo.xcprivacy
          plutil -lint Config/ShabbatWake.entitlements Config/ShabbatWakeWidget.entitlements
          plutil -lint App/en.lproj/Localizable.strings App/he.lproj/Localizable.strings App/en.lproj/InfoPlist.strings App/he.lproj/InfoPlist.strings
          plutil -lint App/Widgets/en.lproj/Localizable.strings App/Widgets/he.lproj/Localizable.strings
          sips -g pixelWidth -g pixelHeight -g hasAlpha App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | tee /tmp/icon.txt
          grep -q "pixelWidth: 1024" /tmp/icon.txt && grep -q "pixelHeight: 1024" /tmp/icon.txt && grep -q "hasAlpha: no" /tmp/icon.txt
          test -s App/Resources/GentleChime.wav
          test -s App/Resources/SunriseSequence.wav
          test -s App/Resources/ClassicWake.wav
          file App/Resources/GentleChime.wav App/Resources/SunriseSequence.wav App/Resources/ClassicWake.wav

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Diagnose resources in generated project
        run: |
          ls -la App/Resources
          grep -n -i "wav\|Resources" ShabbatWake.xcodeproj/project.pbxproj | head -30

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ShabbatWake.xcodeproj \
            -scheme ShabbatWake \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: List bundled alarm sounds
        if: always()
        run: |
          find ~/Library/Developer/Xcode/DerivedData -name "*.wav" -not -path "*/Intermediates*" | head -20
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Shabbat Wake.app" -path "*Products*" | head -1)
          echo "APP=$APP"; ls -la "$APP" | head -40
