name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shabbat-wake-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate original alarm sound assets
        run: python3 App/AlarmSoundGenerator.py

      - name: Validate widget extension plist and generated sounds
        run: |
          plutil -lint App/Widgets/Info.plist
          test -s App/Resources/GentleChime.wav
          test -s App/Resources/SunriseSequence.wav
          test -s App/Resources/ClassicWake.wav
          file App/Resources/GentleChime.wav App/Resources/SunriseSequence.wav App/Resources/ClassicWake.wav

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ShabbatWake.xcodeproj \
            -scheme ShabbatWake \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            test
